name: Fixed-width Prose

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  no-fixed-width-prose:
    name: no-fixed-width-prose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: JustinDFuller-org/ban-fixed-width-prose@v1.2.3
