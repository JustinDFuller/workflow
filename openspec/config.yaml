schema: spec-driven

context: |
  This project is a workflow platform: a small Go engine, plugins, and clients that talk over JSON-RPC.
  The whole platform is specified by the active change, or by openspec/specs/ once it is archived.
  Read its design.md and the specs for any capability you touch before proposing or applying work.
  The engine must hold no knowledge of any specific service, harness, or process. That belongs in plugins.
  Say "Agent Session Manager" in full, never an abbreviation.
  Write each paragraph and list item on one line, with no line breaks inside sentences.
  Draw diagrams in plain ASCII only.
  Put no comments in code samples or code.
